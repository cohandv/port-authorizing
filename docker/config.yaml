server:
    port: 8080
    max_connection_duration: 2h0m0s
    base_url: http://api:8080
    cache:
        ttl: 2m0s
auth:
    jwt_secret: your-secret-key-change-this-in-production
    token_expiry: 30m0s
    providers:
        - name: keycloak
          type: oidc
          enabled: true
          config:
            client_id: port-authorizing
            client_secret: your-client-secret-change-in-production
            issuer: http://keycloak:8180/realms/portauth
            redirect_url: http://localhost:8080/api/auth/oidc/callback
            roles_claim: roles
            username_claim: preferred_username
    users:
        - username: admin
          password: admin123
          roles:
            - admin
        - username: developer
          password: dev123
          roles:
            - developer
connections:
    - name: postgres-test
      type: postgres
      host: postgres
      port: 5432
      duration: 3m0s
      tags:
        - env:test
        - type:database
      metadata:
        database: testdb
        description: Test PostgreSQL database (Docker)
      backend_username:
        ref: myconfigmap
        ref_name: username
        type: configmap
        value: ""
      backend_password: testpass
      backend_database: testdb2
    - name: nginx-server
      type: http
      host: nginx
      port: 80
      scheme: http
      duration: 1h0m0s
      tags:
        - env:test
        - type:web
      metadata:
        description: Test Nginx web server (Docker)
    - name: redis-test-noauth
      type: redis
      host: redis-noauth
      port: 6379
      duration: 5m0s
      tags:
        - env:test
        - type:cache
      metadata:
        database: "0"
        description: Test Redis cache without authentication (Docker)
    - name: redis-test-auth
      type: redis
      host: redis-auth
      port: 6379
      duration: 5m0s
      tags:
        - env:test
        - type:cache
      metadata:
        database: "0"
        description: Test Redis cache with legacy password-only authentication (Docker)
      backend_password: redispass123
    - name: redis-test-acl
      type: redis
      host: redis-acl
      port: 6379
      duration: 5m0s
      tags:
        - env:test
        - type:cache
      metadata:
        database: "0"
        description: Test Redis 6.0+ cache with ACL authentication (Docker)
        redis_version: 6.0+
      backend_username: acluser
      backend_password: aclpass123
    - name: postgres-prod
      type: postgres
      host: prod-db.example.com
      port: 5432
      duration: 15m0s
      tags:
        - env:production
        - type:database
      metadata:
        description: Production PostgreSQL database
    - name: internal-api
      type: http
      host: api.internal.example.com
      port: 443
      scheme: https
      duration: 2h0m0s
      tags:
        - env:production
        - type:api
      metadata:
        description: Internal REST API
    - name: redis-prod
      type: redis
      host: redis.example.com
      port: 6379
      duration: 5m0s
      tags:
        - env:production
        - type:cache
      metadata:
        description: Production Redis cache (password from K8s Secret)
      backend_password:
        ref: redis-prod-credentials
        ref_name: password
        type: secret
        value: ""
    - name: svc
      type: k8s_services
      host: ""
      port: 0
      tags:
        - env:test
      k8s_exclude_namespaces:
        - kube-system
      k8s_port_mappings:
        - port_name: "500"
          port: 5000
          protocol: http
policies:
    - name: admin-database-full
      roles:
        - admin
      tags:
        - env:test
      tag_match: all
      whitelist:
        - .*
    - name: admin-cache-restricted
      roles:
        - admin
      tags:
        - type:cache
      tag_match: all
      whitelist:
        - ^GET .*
        - ^SET .*
        - ^HGET .*
        - ^HSET .*
        - ^HDEL .*
        - ^LPUSH .*
        - ^RPUSH .*
        - ^LPOP .*
        - ^RPOP .*
        - ^LRANGE .*
        - ^SADD .*
        - ^SREM .*
        - ^SMEMBERS .*
        - ^ZADD .*
        - ^ZREM .*
        - ^ZRANGE .*
        - ^EXPIRE .*
        - ^TTL .*
        - ^EXISTS .*
        - ^KEYS .*
        - ^PING
        - ^INFO.*
        - ^DBSIZE
        - ^COMMAND DOCS
        - ^DEL .*
    - name: dev-test
      roles:
        - developer
      tags:
        - env:test
      tag_match: any
      whitelist:
        - ^SELECT.*
        - ^EXPLAIN.*
        - ^SET.*
        - ^SHOW.*
        - ^BEGIN.*
        - ^COMMIT.*
        - ^ROLLBACK.*
        - ^GET /.*
        - ^GET .*
        - ^SET .*
        - ^HGET .*
        - ^HSET .*
        - ^LPUSH .*
        - ^RPUSH .*
        - ^LRANGE .*
        - ^SADD .*
        - ^SMEMBERS .*
        - ^ZADD .*
        - ^ZRANGE .*
        - ^EXPIRE .*
        - ^TTL .*
        - ^EXISTS .*
        - ^KEYS .*
        - ^PING
        - ^POST /api/.*
        - ^PUT /api/.*
        - ^PATCH /api/.*
    - name: dev-prod-readonly
      roles:
        - developer
      tags:
        - env:production
      tag_match: any
      whitelist:
        - ^SELECT.*
        - ^EXPLAIN.*
        - ^SET.*
        - ^SHOW.*
        - ^BEGIN.*
        - ^COMMIT.*
        - ^ROLLBACK.*
        - ^GET .*
security:
    enable_llm_analysis: false
    llm_provider: openai
logging:
    audit_log_path: stdout
    log_level: info
approval:
    enabled: true
    patterns:
        - pattern: ^DELETE /.*
          tags:
            - env:test
          tag_match: all
          roles:
            - admin
            - pepe
          role_match: any
          timeout_seconds: 30
        - pattern: ^DELETE FROM.*
          tags:
            - env:test
          tag_match: all
          timeout_seconds: 10
        - pattern: ^DROP TABLE.*
          tags:
            - env:test
          tag_match: all
          timeout_seconds: 10
        - pattern: ^DROP DATABASE.*
          tags:
            - env:test
          tag_match: all
          timeout_seconds: 10
        - pattern: ^TRUNCATE.*
          tags:
            - env:test
          tag_match: all
          timeout_seconds: 10
        - pattern: ^UPDATE.*
          tags:
            - env:test
          tag_match: all
          timeout_seconds: 10
        - pattern: ^DEL .*
          tags:
            - env:test
            - type:cache
          tag_match: any
          roles:
            - admin
          role_match: any
          timeout_seconds: 30
        - pattern: ^SET.*
          tag_match: all
          roles:
            - admin
          role_match: any
          timeout_seconds: 300
    webhook:
        url: ""
    slack:
        webhook_url: ""
kubernetes:
    discovery:
        configuration:
            namespaces:
                - port-authorizer
environment: mytest
